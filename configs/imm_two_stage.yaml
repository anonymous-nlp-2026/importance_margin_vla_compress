# Two-stage v9: load converged baseline_v5, freeze backbone+LoRA, train ACIS only.
# Addresses G3 failure in v7/v7.2/v8 — eliminates backbone co-adaptation with token selection.
# Stage 1 (only stage): ACIS learns importance scoring on fixed, task-adapted features.
# Stage 2: skipped (stage2_steps=0). Backbone stays frozen throughout.

_base_: imm_anchor.yaml

imm:
  gradient_isolation: true   # Safety net detach (cost-free with frozen backbone)
  lambda_margin: 1.0         # Full margin weight (backbone frozen, no risk)
  delta: 0.3
  k_ratio: 0.5
  warmup_steps: 0            # No lambda warmup (margin_loss only, no action_loss)

twostage:
  baseline_checkpoint: "checkpoints/baseline/step_029999/checkpoint.pt"
  stage1_steps: 30000        # Entire training = ACIS only
  stage2_steps: 0            # No Stage 2 — backbone stays frozen
  stage1_lr: 5.0e-4          # Higher LR for small ACIS module
  stage1_warmup_steps: 500
  stage2_lr: 0.0
  stage2_warmup_steps: 0

training:
  output_dir: "checkpoints/imm_two_stage"
  total_steps: 30000
  grad_clip: 10.0
  save_every: 2000
  eval_every: 999999
  log_every: 50
  batch_size: 4
