# Stage2 Recovery: progressive pruning with low LR expert fine-tuning.
# Load ACIS from Stage1 (k07), freeze ACIS, unfreeze expert.
# Progressive k_ratio: 0.9 (0-5K) -> 0.7 (5-10K) -> 0.5 (10-20K)
# LR = 2e-6 (10x lower than Stage1 to avoid catastrophic forgetting)

_base_: libero_baseline.yaml

model:
  train_expert_only: true
  lora:
    rank: 0

imm:
  enabled: true
  gradient_isolation: false
  lambda_margin: 0.0
  delta: 0.3
  k_ratio: 0.9
  temperature: 0.5
  soft_topk_method: "sigmoid"
  warmup_steps: 0
  k_ratio_schedule:
    type: piecewise
    breakpoints:
      - [0, 0.9]
      - [5000, 0.7]
      - [10000, 0.5]

acis:
  visual_dim: 960
  action_dim: 720
  num_heads: 8
  dropout: 0.0

stage2_recovery:
  checkpoint: "checkpoints/libero_acis_stage1only_k07/stage1_done/checkpoint.pt"

training:
  output_dir: "checkpoints/libero_stage2_recovery"
  total_steps: 20000
  lr: 2.0e-6
  warmup_steps: 500
  grad_clip: 10.0
  save_every: 2000
  eval_every: 999999
  log_every: 1
  batch_size: 4
