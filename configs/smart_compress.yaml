# Smart Compress: cross-attention pooling to compress 128 vision tokens -> M tokens.
# Trainable: VisionTokenCompressor + action expert + projections.
# Frozen: SigLIP + connector + VLM text model.

model:
  name: smolvla
  pretrained: "/root/autodl-tmp/.hf_cache/lerobot/smolvla_base"

compressor:
  num_queries: 32      # M = 32 compressed tokens (75% compression)
  num_heads: 12        # 960/12 = 80 dim per head
  num_layers: 2        # 2 cross-attention + FFN blocks
  dropout: 0.1

dataset:
  repo_id: "HuggingFaceVLA/libero"
  features:
    state_dim: 8
    action_dim: 7
    cameras:
      - "observation.images.image"
      - "observation.images.image2"

training:
  total_steps: 100000
  batch_size: 4
  eval_batch_size: 1
  num_workers: 4
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  warmup_steps: 1000
  decay_lr: 2.5e-6
  grad_clip: 10.0
  eval_every: 5000
  save_every: 1000
  log_every: 50
  output_dir: "checkpoints/smart_compress_m32"
  seed: 42

evaluation:
  max_eval_batches: 50
