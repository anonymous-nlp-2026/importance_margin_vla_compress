# v8c: mask ratio annealing — keep_ratio 0.9 → 0.5 over training
# Based on v8 (gradient_isolation=true, λ=0.5, delta=0.3)
# Goal: reduce G3 by letting backbone gradually adapt to pruning

_base_: imm_anchor_v8.yaml

imm:
  gradient_isolation: true
  lambda_margin: 0.5
  delta: 0.3
  k_ratio: 0.9  # initial value (overridden by schedule)

  k_ratio_schedule:
    type: linear
    start: 0.9
    end: 0.5
    warmup_steps: 5000    # 0-5K: hold at 0.9
    anneal_steps: 20000   # 5K-25K: linear 0.9→0.5
    # 25K-30K: hold at 0.5

training:
  output_dir: "checkpoints/imm_anchor_v8c_annealing"
  total_steps: 30000
  grad_clip: 10.0
  save_every: 2000
  eval_every: 999999
