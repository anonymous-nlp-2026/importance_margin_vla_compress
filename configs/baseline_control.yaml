# MF3 Baseline Control: fresh lr schedule on libero_full_ft checkpoint.
# Tests whether Smart Compress 15pp gain comes from re-encoding vs fresh lr schedule.
#
# Setup:
#   - Init from libero_full_ft step_099999 (model weights only)
#   - No VisionTokenCompressor: 128 vision tokens -> LLM directly
#   - Freeze SigLIP + connector + LLM backbone
#   - Train only action_head/expert
#   - Fresh lr=1e-4 cosine schedule (identical to Smart Compress)

model:
  name: smolvla
  pretrained: "/root/autodl-tmp/.hf_cache/lerobot/smolvla_base"
  init_checkpoint: "checkpoints/libero_full_ft/step_099999/checkpoint.pt"

dataset:
  repo_id: "HuggingFaceVLA/libero"
  features:
    state_dim: 8
    action_dim: 7
    cameras:
      - "observation.images.image"
      - "observation.images.image2"

training:
  total_steps: 100000
  batch_size: 4
  eval_batch_size: 1
  num_workers: 4
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  warmup_steps: 1000
  decay_lr: 2.5e-6
  grad_clip: 10.0
  eval_every: 5000
  save_every: 10000
  log_every: 50
  output_dir: "checkpoints/baseline_control"
  seed: 42

evaluation:
  max_eval_batches: 50
