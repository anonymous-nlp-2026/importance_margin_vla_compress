# OpenVLA Smart Compress + LoRA: VTC (128 queries) + LoRA on LLM backbone.
# Trainable: VisionTokenCompressor + LoRA adapters (~8M extra params).
# Frozen: DINOv2 + SigLIP + projector + Llama-2 7B (except LoRA layers).

model:
  name: openvla
  pretrained: "/root/autodl-tmp/openvla-libero-object"
  dtype: "bfloat16"
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_target_modules: ["q_proj", "v_proj"]

compressor:
  hidden_dim: 4096
  num_queries: 128
  num_heads: 16
  num_layers: 2
  dropout: 0.1

dataset:
  repo_id: "HuggingFaceVLA/libero"
  action_chunk_size: 1
  features:
    state_dim: 8
    action_dim: 7
    cameras:
      - "observation.images.image"

training:
  total_steps: 100000
  batch_size: 8
  eval_batch_size: 1
  num_workers: 4
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  warmup_steps: 1000
  decay_lr: 2.5e-6
  grad_clip: 10.0
  eval_every: 5000
  save_every: 10000
  log_every: 50
  output_dir: "checkpoints/openvla_sc_m128_lora"
  seed: 42

evaluation:
  max_eval_batches: 50
